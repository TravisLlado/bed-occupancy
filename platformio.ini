; PlatformIO Project Configuration File
; Bed Occupancy - four flat-flex sensors on ESP32-C3 SuperMini, web console tuning

[platformio]
default_envs = demo

[env]
platform = espressif32
board = adafruit_qtpy_esp32c3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags =
  -std=gnu++11
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -std=gnu++17
  -Wall
  -Wextra
  -I${sysenv.CREDENTIALS_INCLUDE}
lib_deps =
  me-no-dev/ESPAsyncWebServer@3.6.0
  https://github.com/TravisLlado/WebConsole.git#v1.0.0

[env:demo]
